<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión · CULTYRA</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #061008; color: #eafff0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px;
    }
    .glow-bg {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(22,101,52,0.14), transparent);
    }
    .wifi-icon {
      font-size: 64px; margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    img.logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 20px; filter: drop-shadow(0 0 14px rgba(52,199,89,0.25)); }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(22px,5vw,34px); color: #eafff0; margin-bottom: 10px; }
    p { color: #7aad7e; font-size: 15px; max-width: 380px; line-height: 1.7; margin-bottom: 10px; }
    .tip { color: rgba(158,197,162,0.55); font-size: 13px; max-width: 340px; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block; background: none;
      color: #34c759; font-weight: 700; font-size: 14px;
      padding: 12px 32px; border-radius: 999px; text-decoration: none;
      border: 1px solid rgba(52,199,89,0.45); cursor: pointer;
      transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .btn:hover { background: rgba(52,199,89,0.08); transform: translateY(-1px); }
    .badge { margin-top: 40px; font-family: 'Space Mono', monospace; font-size: 11px; color: rgba(158,197,162,0.35); letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <div class="wifi-icon">📡</div>
  <img src="img/logo.png" alt="Cultyra" class="logo">
  <h1>Sin conexión a internet</h1>
  <p>No te preocupes — tus fincas, tareas y registros guardados están disponibles.</p>
  <p class="tip">El clima y el asistente IA necesitan internet. Cuando recuperes la señal, todo se sincronizará automáticamente.</p>
  <button class="btn" onclick="location.reload()">🔄 Intentar de nuevo</button>
  <p class="badge">CULTYRA · STEAM 2026 · CTP José Figueres Ferrer</p>
</body>
</html>
