<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Página no encontrada · CULTYRA</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #061008; color: #eafff0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 24px;
    }
    .glow-bg {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(22,101,52,0.18), transparent);
    }
    img.logo { width: 72px; height: 72px; object-fit: contain; margin-bottom: 24px; filter: drop-shadow(0 0 18px rgba(52,199,89,0.35)); }
    .code {
      font-family: 'Space Mono', monospace; font-size: 96px; font-weight: 700;
      background: linear-gradient(135deg, #34c759, #86efac);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1; margin-bottom: 16px;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(22px,5vw,36px); color: #eafff0; margin-bottom: 10px; }
    p { color: #7aad7e; font-size: 16px; max-width: 420px; line-height: 1.7; margin-bottom: 32px; }
    .btn {
      display: inline-block; background: linear-gradient(135deg, #166534, #34c759);
      color: #061008; font-weight: 700; font-size: 15px;
      padding: 14px 36px; border-radius: 999px; text-decoration: none;
      transition: all 0.2s; border: none; cursor: pointer;
      box-shadow: 0 8px 24px rgba(52,199,89,0.25);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(52,199,89,0.35); }
    .badge {
      margin-top: 40px; font-family: 'Space Mono', monospace; font-size: 11px;
      color: rgba(158,197,162,0.4); letter-spacing: 2px; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  <img src="img/logo.png" alt="Cultyra" class="logo">
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>La dirección que buscas no está disponible. Puede que haya cambiado o nunca haya existido.</p>
  <a href="/" class="btn">← Volver al inicio</a>
  <p class="badge">CULTYRA · STEAM 2026 · CTP José Figueres Ferrer</p>
</body>
</html>
